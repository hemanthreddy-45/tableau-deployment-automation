name: Deploy Commit to Opsera Pipeline

# Trigger when someone pushes to the deployment queue branch
on:
  push:
    branches:
      - deployment-queue

# Ensure all commits are processed sequentially (none skipped)
concurrency:
  group: opsera-deployment-queue
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      ###########################################################
      # 1. Checkout code for the exact commit pushed
      ###########################################################
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.sha }}

      ###########################################################
      # 2. Extract commit SHA for logging and pipeline tracking
      ###########################################################
      - name: Extract commit SHA
        id: extract_sha
        run: |
          echo "commit_sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "Processing commit: ${GITHUB_SHA}"

      ###########################################################
      # 3. Trigger Opsera pipeline WITHOUT stepId
      ###########################################################
      - name: Trigger Opsera Pipeline
        id: trigger
        env:
          API_URL: ${{ secrets.OPSERA_API_URL }}
          API_TOKEN: ${{ secrets.OPSERA_API_TOKEN }}
          PIPELINE_ID: ${{ secrets.OPSERA_PIPELINE_ID }}
          COMMIT_SHA: ${{ steps.extract_sha.outputs.commit_sha }}
        run: |
          echo "Triggering Opsera pipeline for commit ${COMMIT_SHA}"

          # Build JSON request WITHOUT stepId
          REQUEST_BODY=$(jq -n \
            --arg p "$PIPELINE_ID" \
            --arg m "Triggered by commit: $COMMIT_SHA" \
            '{pipelineId: $p, notificationMessage: $m}')

          echo "Request Body: $REQUEST_BODY"

          # Make API call
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY" \
            "$API_URL")

          echo "API Response: $RESPONSE"

          # Extract execution ID from response
          EXEC_ID=$(echo "$RESPONSE" | jq -r '.executionId')

          if [[ -z "$EXEC_ID" || "$EXEC_ID" == "null" ]]; then
            echo "Failed to trigger Opsera pipeline"
            exit 1
          fi

          echo "execution_id=$EXEC_ID" >> $GITHUB_OUTPUT
          echo "Pipeline triggered successfully with execution ID: $EXEC_ID"

      ###########################################################
      # 4. Poll Opsera for pipeline execution status
      ###########################################################
      - name: Poll Opsera Pipeline Status
        env:
          API_TOKEN: ${{ secrets.OPSERA_API_TOKEN }}
          STATUS_URL: ${{ secrets.OPSERA_STATUS_URL }}
          EXEC_ID: ${{ steps.trigger.outputs.execution_id }}
        run: |
          echo "Polling Opsera pipeline status for execution ID: ${EXEC_ID}"

          for i in {1..60}; do
            RESPONSE=$(curl -s -X GET \
              -H "Authorization: Bearer ${API_TOKEN}" \
              "${STATUS_URL}/${EXEC_ID}")

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Status: $STATUS"

            if [[ "$STATUS" == "completed" ]]; then
              echo "Pipeline completed successfully"
              exit 0
            fi

            if [[ "$STATUS" == "failed" ]]; then
              echo "Pipeline failed"
              exit 1
            fi

            sleep 30
          done

          echo "Pipeline did not complete within expected time window"
          exit 1
