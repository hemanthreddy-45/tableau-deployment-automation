name: Minimal Opsera Trigger

on:
  push:
    branches:
      - deployment-queue

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Trigger Opsera Pipeline
        env:
          API_URL: ${{ secrets.OPESRA_API_URL }}
          API_TOKEN: ${{ secrets.OPESRA_API_TOKEN }}
          PIPELINE_ID: ${{ secrets.OPESRA_PIPELINE_ID }}
          STEP_ID: ${{ secrets.OPESRA_STEP_ID }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"pipelineId":"'"$PIPELINE_ID"'","stepId":"'"$STEP_ID"'","notificationMessage":"Test commit"}' \
            "$API_URL"
